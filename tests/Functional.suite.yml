# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: FunctionalTester
modules:
    enabled:
        - REST:
              depends: PhpBrowser
              url: 'http://127.0.0.1:8888'
        - Asserts
    config:
        PhpBrowser:
            url: 'http://127.0.0.1:8888'
            headers:
                Content-Type: application/json
extensions:
    enabled:
        # Serves the app and collects its code coverage
        - Tests\Support\Extension\BuiltinServer
# Coverage of the app is collected by the BuiltinServer extension, not through c3.php
coverage:
    enabled: false

step_decorators: ~
